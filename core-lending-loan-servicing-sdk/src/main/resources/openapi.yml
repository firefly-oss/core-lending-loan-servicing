openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Loan Escrow
  description: "Manage loan escrow accounts for all lending products including insurance,\
    \ taxes, maintenance reserves, freight/shipping, debt service reserves, and other\
    \ escrow purposes"
- name: LoanRepaymentRecord
  description: Operations for Loan Repayment Records
- name: LoanRepaymentSchedule
  description: Operations for Loan Repayment Schedules
- name: Loan Notification
  description: "Manage loan notifications sent to parties via email, SMS, push, in-app,\
    \ mail, or phone"
- name: LoanServicingCase
  description: Operations for Loan Servicing Cases
- name: LoanInstallmentPlan
  description: Operations for Loan Installment Plans
- name: LoanAccrual
  description: "Operations for Loan Accruals (interest, fees, etc.)"
- name: LoanServicingEvent
  description: Operations for Loan Servicing Events
- name: LoanBalance
  description: Operations for Loan Balance tracking and history
- name: LoanInstallmentRecord
  description: Operations for Loan Installment Records
- name: LoanRateChange
  description: Operations for Loan Rate Changes
- name: Loan Disbursement Plan
  description: "Manage loan disbursement plans for construction loans, staged funding,\
    \ and line of credit draws"
- name: LoanDisbursement
  description: Operations for Loan Disbursements
- name: LoanRestructuring
  description: Operations for Loan Restructuring events
- name: LoanDisbursementExternalTransaction
  description: Operations for external PSP disbursement transactions
- name: Loan Rebate
  description: "Manage loan rebates including borrower rebates, distributor commissions,\
    \ and promotional incentives"
- name: LoanDisbursementInternalTransaction
  description: Operations for internal disbursement transactions
